# Travel House Appium CI/CD — self-hosted Windows runner + USB phone
# Secrets: LOGIN_EMAIL, LOGIN_PASSWORD, DEVICE_UDID (optional)

name: Android Appium CI/CD

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "TestNG suite to run"
        required: true
        default: ci-health
        type: choice
        options:
          - ci-health
          - dual-route
          - smoke
          - regression
      skip_appium_start:
        description: "Skip starting Appium (use already-running server)"
        required: false
        default: false
        type: boolean

  push:
    branches: [main, master, feature/login-flight-search]
    paths:
      - "src/test/**"
      - "pom.xml"
      - "scripts/**"
      - ".github/workflows/**"

  pull_request:
    branches: [main, master]
    paths:
      - "src/test/**"
      - "pom.xml"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: appium-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appium:
    name: Appium (${{ github.event.inputs.suite || 'ci-health' }})
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tools
        shell: cmd
        run: |
          java -version
          mvn -v
          adb version

      - name: Compile tests
        shell: cmd
        run: |
          mvn -B -DskipTests test-compile
          if errorlevel 1 exit /b 1
          echo COMPILE_OK

      - name: Wait for Android device
        shell: powershell
        run: |
          # GHA sets ErrorActionPreference=Stop; keep Continue for native tools.
          # Do NOT adb kill-server: the runner service is NETWORK SERVICE and cannot
          # reopen USB. It must reuse the interactive user's already-running adb daemon.
          $ErrorActionPreference = "Continue"
          Write-Host "whoami=$(whoami)"
          cmd /c "adb devices -l"
          $ready = $false
          for ($i = 1; $i -le 15; $i++) {
            $raw = cmd /c "adb devices"
            $devices = @($raw -split "`r?`n" | Where-Object { $_ -match "\tdevice$" })
            if ($devices.Count -gt 0) {
              Write-Host "Device ready: $($devices[0])"
              $ready = $true
              break
            }
            Write-Host "Waiting for device attempt $i/15 - keep phone unlocked; ensure 'adb start-server' was run in your desktop session"
            Start-Sleep -Seconds 4
            cmd /c "adb devices -l"
          }
          if (-not $ready) {
            Write-Host "No Android device connected. On the runner PC, in an interactive terminal run: adb start-server && adb devices"
            exit 1
          }

      - name: Run Appium suite
        shell: powershell
        env:
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          DEVICE_UDID: ${{ secrets.DEVICE_UDID }}
          APPIUM_SERVER_URL: ${{ secrets.APPIUM_SERVER_URL }}
          SUITE_INPUT: ${{ github.event.inputs.suite }}
          SKIP_APPIUM: ${{ github.event.inputs.skip_appium_start }}
        run: |
          $choice = $env:SUITE_INPUT
          if ([string]::IsNullOrWhiteSpace($choice)) { $choice = "ci-health" }
          switch ($choice) {
            "smoke"      { $xml = "src\test\resources\smoke.xml" }
            "regression" { $xml = "src\test\resources\regression.xml" }
            "dual-route" { $xml = "src\test\resources\dual-route-booking.xml" }
            default      { $xml = "src\test\resources\ci-health.xml"; $choice = "ci-health" }
          }
          Write-Host "Running suite=$choice xml=$xml"
          if (-not (Test-Path $xml)) { throw "Suite XML not found: $xml" }
          $args = @{ SuiteXml = $xml }
          if ($env:SKIP_APPIUM -eq "true") { $args.SkipAppiumStart = $true }
          & .\scripts\ci-run.ps1 @args
          exit $LASTEXITCODE

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelhouse-appium-reports-${{ github.run_number }}
          path: |
            reports/
            screenshots/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
