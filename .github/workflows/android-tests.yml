# Travel House Appium — GitHub Actions (self-hosted Windows + physical device)
#
# Prerequisites on the runner PC:
#   JDK 17, Maven, Appium + uiautomator2, adb, phone connected & authorized
#
# Secrets: LOGIN_EMAIL, LOGIN_PASSWORD, DEVICE_UDID (optional)

name: Android Appium CI/CD

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "TestNG suite to run"
        required: true
        default: dual-route
        type: choice
        options:
          - dual-route
          - smoke
          - regression
      skip_appium_start:
        description: "Skip starting Appium (use already-running server)"
        required: false
        default: false
        type: boolean

  push:
    branches: [main, master, feature/login-flight-search]
    paths:
      - "src/test/**"
      - "pom.xml"
      - "scripts/**"
      - ".github/workflows/**"

  pull_request:
    branches: [main, master]
    paths:
      - "src/test/**"
      - "pom.xml"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: appium-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-appium:
    name: Appium (${{ github.event.inputs.suite || 'dual-route' }})
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup check
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Java:"
          java -version
          Write-Host "Maven:"
          mvn -v
          Write-Host "ADB:"
          adb version
          adb kill-server
          Start-Sleep -Seconds 2
          adb start-server
          Start-Sleep -Seconds 2
          adb devices -l
          $ready = $false
          for ($i = 1; $i -le 6; $i++) {
            $devices = @(adb devices | Where-Object { $_ -match "\tdevice$" })
            if ($devices.Count -gt 0) {
              Write-Host "Device ready: $($devices[0])"
              $ready = $true
              break
            }
            Write-Host "Waiting for device attempt $i/6 ..."
            Start-Sleep -Seconds 5
            adb devices -l
          }
          if (-not $ready) {
            throw "No Android device connected. Plug in the phone, enable USB debugging, tap Allow, then re-run."
          }

      - name: Run Appium suite
        shell: powershell
        env:
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          DEVICE_UDID: ${{ secrets.DEVICE_UDID }}
          APPIUM_SERVER_URL: ${{ secrets.APPIUM_SERVER_URL }}
          SUITE_INPUT: ${{ github.event.inputs.suite }}
          SKIP_APPIUM: ${{ github.event.inputs.skip_appium_start }}
        run: |
          $ErrorActionPreference = "Stop"
          $choice = $env:SUITE_INPUT
          if ([string]::IsNullOrWhiteSpace($choice)) { $choice = "dual-route" }
          switch ($choice) {
            "smoke"       { $xml = "src/test/resources/smoke.xml" }
            "regression"  { $xml = "src/test/resources/regression.xml" }
            default       { $xml = "src/test/resources/dual-route-booking.xml"; $choice = "dual-route" }
          }
          Write-Host "Running suite=$choice xml=$xml"
          $skip = ($env:SKIP_APPIUM -eq "true")
          if ($skip) {
            & .\scripts\ci-run.ps1 -SuiteXml $xml -SkipAppiumStart
          } else {
            & .\scripts\ci-run.ps1 -SuiteXml $xml
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload HTML reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelhouse-appium-reports-${{ github.run_number }}
          path: |
            reports/
            screenshots/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: always()
        shell: powershell
        run: |
          $suite = $env:SUITE_INPUT
          if ([string]::IsNullOrWhiteSpace($suite)) { $suite = "dual-route" }
          $lines = @(
            "## Travel House Appium CI",
            "",
            "| Item | Value |",
            "| --- | --- |",
            "| Branch | ${{ github.ref_name }} |",
            "| Suite | $suite |",
            "| Report artifact | travelhouse-appium-reports-${{ github.run_number }} |",
            "",
            "Download the artifact for the App Behaviour Pass/Fail HTML report."
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n") -Encoding utf8
