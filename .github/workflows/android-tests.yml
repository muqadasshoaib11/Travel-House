# Travel House Appium CI/CD — self-hosted Windows runner + USB phone
# Secrets: LOGIN_EMAIL, LOGIN_PASSWORD, DEVICE_UDID (optional)

name: Android Appium CI/CD

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "TestNG suite to run"
        required: true
        default: dual-route
        type: choice
        options:
          - dual-route
          - smoke
          - regression
      skip_appium_start:
        description: "Skip starting Appium (use already-running server)"
        required: false
        default: false
        type: boolean

  push:
    branches: [main, master, feature/login-flight-search]
    paths:
      - "src/test/**"
      - "pom.xml"
      - "scripts/**"
      - ".github/workflows/**"

  pull_request:
    branches: [main, master]
    paths:
      - "src/test/**"
      - "pom.xml"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: appium-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appium:
    name: Appium (${{ github.event.inputs.suite || 'dual-route' }})
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tools
        shell: cmd
        run: |
          java -version
          mvn -v
          adb version

      - name: Compile tests
        shell: cmd
        run: |
          mvn -B -DskipTests test-compile
          if errorlevel 1 exit /b 1
          echo COMPILE_OK

      - name: Wait for Android device
        shell: cmd
        run: |
          adb kill-server
          adb start-server
          adb devices -l
          set READY=0
          for /L %%i in (1,1,10) do (
            adb devices | findstr /R /C:"device$" >nul
            if not errorlevel 1 (
              echo Device ready
              set READY=1
              goto :done
            )
            echo Waiting for device attempt %%i/10 - plug in phone and authorize USB debugging
            timeout /t 6 /nobreak >nul
            adb devices -l
          )
          :done
          if "%READY%"=="0" (
            echo No Android device connected
            exit /b 1
          )

      - name: Run Appium suite
        shell: powershell
        env:
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          DEVICE_UDID: ${{ secrets.DEVICE_UDID }}
          APPIUM_SERVER_URL: ${{ secrets.APPIUM_SERVER_URL }}
          SUITE_INPUT: ${{ github.event.inputs.suite }}
          SKIP_APPIUM: ${{ github.event.inputs.skip_appium_start }}
        run: |
          $choice = $env:SUITE_INPUT
          if ([string]::IsNullOrWhiteSpace($choice)) { $choice = "dual-route" }
          switch ($choice) {
            "smoke"      { $xml = "src\test\resources\smoke.xml" }
            "regression" { $xml = "src\test\resources\regression.xml" }
            default      { $xml = "src\test\resources\dual-route-booking.xml"; $choice = "dual-route" }
          }
          Write-Host "Running suite=$choice xml=$xml"
          if (-not (Test-Path $xml)) { throw "Suite XML not found: $xml" }
          $args = @{ SuiteXml = $xml }
          if ($env:SKIP_APPIUM -eq "true") { $args.SkipAppiumStart = $true }
          & .\scripts\ci-run.ps1 @args
          exit $LASTEXITCODE

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelhouse-appium-reports-${{ github.run_number }}
          path: |
            reports/
            screenshots/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
