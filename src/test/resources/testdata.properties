# Installments return-search flow
flight.origin=London

# Return: London → Jeddah
flight.return.destination=Jeddah
flight.return.destination.query=Jeddah
flight.trip.type.return=Return

# Installments require departure ~2 months in advance
flight.departure.months.ahead=2
flight.return.days.after.departure=7

# One Way: London → Karachi
flight.oneway.destination=Karachi
flight.oneway.destination.query=Karachi
flight.trip.type.oneway=One Way

# Traveller contact (email comes from login.email in config.properties)
traveller.mobile=7700900123
traveller.country.code=United Kingdom
traveller.frequent.flyer=PK123456789
